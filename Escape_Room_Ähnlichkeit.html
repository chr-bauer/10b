<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Die Scherben von Proportanien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Uncial+Antiqua&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3b2a1a; --parch:#fff8e6; --parch2:#f4e2bc; --edge:#a8723a;
  --gold:#ffd77a; --gold2:#f0a93a; --violet:#6b4bb8; --ok:#3fae5a; --bad:#d9534f;
  --night:#2c1f5c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --night:#1d1442; } }
:root[data-theme="dark"]{ --night:#1d1442; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; overflow:hidden; }
body{
  background:radial-gradient(circle at 70% 35%, #fff4fb 0%, #cdbdff 40%, #6f5cc9 80%, var(--night) 100%);
  font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif; color:var(--ink);
  touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
input{ -webkit-user-select:text; user-select:text; }
#c{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
#fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:60; }
.hidden{ display:none !important; }

/* Buttons */
.btn{ font-family:inherit; font-size:17px; font-weight:600; color:#4a2a0c; background:linear-gradient(#ffe39a,#f0a93a);
  border:2px solid #9a5a1c; border-radius:14px; padding:10px 18px; box-shadow:0 4px 0 #9a5a1c; cursor:pointer; line-height:1.2; }
.btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #9a5a1c; }
.btn:focus-visible,.opt:focus-visible,.pick:focus-visible,.chip:focus-visible{ outline:3px solid var(--violet); outline-offset:2px; }
.btn.ghost{ background:linear-gradient(#fffdf6,#f1e3c4); }
.btn.big{ font-size:20px; padding:13px 24px; }
.btn.sm{ font-size:15px; padding:6px 11px; border-radius:11px; box-shadow:0 3px 0 #9a5a1c; }
.btn.magic{ background:linear-gradient(#c3a8ff,#7b5ad6); color:#fff; border-color:#4b2f9a; box-shadow:0 4px 0 #4b2f9a; }

/* Parchment */
.parchment{ background:linear-gradient(160deg,#fffdf4 0%,var(--parch) 45%,var(--parch2) 100%);
  border:3px solid var(--edge); border-radius:22px;
  box-shadow:0 12px 40px rgba(30,10,60,.45), inset 0 0 50px rgba(168,114,58,.16); }
h1,h2,.fancy{ font-family:'Uncial Antiqua','Fredoka',serif; font-weight:400; }

/* HUD */
#hud{ position:fixed; top:0; left:0; right:0; padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;
  display:flex; justify-content:space-between; align-items:flex-start; gap:8px; pointer-events:none; z-index:10; }
#hud > *{ pointer-events:auto; }
.hgroup{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.pill{ background:rgba(255,250,236,.94); border:2px solid var(--edge); border-radius:999px; padding:5px 12px;
  font-weight:600; box-shadow:0 3px 0 rgba(90,50,20,.35); display:inline-flex; align-items:center; gap:6px; font-size:16px; white-space:nowrap; }
.pill .shard{ width:16px; height:19px; }
.pill.me{ padding-left:5px; }
.pill.me .av{ width:30px; height:30px; border-radius:50%; background:#e9ddff; display:grid; place-items:center; font-size:19px; }
#minimap{ position:fixed; right:10px; top:calc(env(safe-area-inset-top,0px) + 58px); width:128px; height:128px;
  border-radius:50%; border:3px solid var(--edge); box-shadow:0 4px 12px rgba(0,0,0,.3); z-index:9; background:#a8d982; }
#camCtl{ position:fixed; right:10px; bottom:calc(env(safe-area-inset-bottom,0px) + 12px); display:grid; grid-template-columns:repeat(2,48px); gap:8px; z-index:9; }
#camCtl button{ width:48px; height:48px; border-radius:50%; font-size:22px; font-family:inherit; font-weight:700; color:#4a2a0c;
  background:rgba(255,250,236,.92); border:2px solid var(--edge); box-shadow:0 3px 0 rgba(90,50,20,.35); }
body.talking #camCtl, body.talking #dpad{ display:none; }
#dpad{ position:fixed; left:12px; bottom:calc(env(safe-area-inset-bottom,0px) + 12px); display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(3,54px); gap:4px; z-index:9; touch-action:none; }
#dpad button{ border-radius:14px; font-size:24px; font-family:inherit; font-weight:700; color:#4a2a0c; background:rgba(255,250,236,.9); border:2px solid var(--edge); box-shadow:0 3px 0 rgba(90,50,20,.35); touch-action:none; -webkit-user-select:none; user-select:none; }
#dpad button.on{ background:#ffd77a; transform:translateY(2px); box-shadow:0 1px 0 rgba(90,50,20,.35); }
#dpad .talk{ font-size:22px; background:#efe6ff; }

#toast{ position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 64px); transform:translate(-50%,-20px); opacity:0;
  background:#3b2470; color:#fff; padding:10px 18px; border-radius:16px; font-weight:500; font-size:17px; z-index:50;
  transition:opacity .3s, transform .3s; max-width:min(560px,86vw); text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.35); pointer-events:none; }
#toast.show{ opacity:1; transform:translate(-50%,0); }

/* Dialog */
#dialog{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  width:min(820px, calc(100% - 20px)); display:flex; gap:14px; padding:14px 16px; z-index:20; }
.portrait{ flex:0 0 74px; height:74px; border-radius:50%; display:grid; place-items:center; font-size:40px; border:3px solid var(--edge); box-shadow:inset 0 -6px 0 rgba(0,0,0,.12); }
.dbody{ flex:1; min-width:0; }
.dname{ font-family:'Uncial Antiqua',serif; color:var(--violet); font-size:19px; margin-bottom:2px; }
.dtext{ font-size:18px; line-height:1.42; min-height:2.6em; }
.dopts{ margin-top:6px; border-top:2px dashed rgba(168,114,58,.4); padding-top:4px; }
.opt{ display:block; width:100%; text-align:left; font-family:inherit; font-size:17px; color:#5a2fa8; background:none; border:none;
  padding:8px 8px; border-radius:10px; cursor:pointer; font-weight:500; }
.opt:active,.opt:hover{ background:rgba(107,75,184,.12); }
.opt span{ color:var(--gold2); }

/* Modal */
#modal{ position:fixed; inset:0; background:rgba(26,12,52,.55); display:flex; align-items:center; justify-content:center; z-index:40;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 14px); }
#modalBox{ width:min(780px,100%); max-height:100%; overflow:auto; -webkit-overflow-scrolling:touch; padding:22px 24px; }
#modalBox.shake{ animation:shake .4s; }
@keyframes shake{ 20%{transform:translateX(-10px)} 40%{transform:translateX(9px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(4px)} }
.mhead{ display:flex; gap:14px; align-items:center; margin-bottom:10px; }
.micon{ flex:0 0 58px; height:58px; border-radius:50%; display:grid; place-items:center; font-size:32px; border:3px solid var(--edge); }
.mkick{ font-size:15px; color:#8a5a2b; font-weight:500; }
.mhead h2{ margin:0; font-size:26px; color:var(--violet); line-height:1.15; }
.quote{ font-style:italic; color:#6a4a2a; margin:4px 0 10px; font-size:17px; }
.task{ font-size:18px; line-height:1.5; background:#fffdf6; border:2px solid #e8d6ad; border-radius:14px; padding:12px 16px; }
.fig{ display:block; width:100%; height:auto; max-height:250px; background:#fffdf6; border-radius:14px; border:2px solid #e8d6ad; margin:10px 0; }
.heft{ display:flex; gap:10px; align-items:center; background:#efe6ff; border-radius:14px; padding:10px 14px; margin:12px 0 4px; font-size:16px; color:#4b2f9a; }
.heft b{ font-size:24px; }
.mbtns{ display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:16px; }
details.tdet{ margin:6px 0 10px; }
details.tdet summary{ cursor:pointer; font-weight:600; color:var(--violet); padding:6px 0; font-size:17px; }
.note{ font-size:15px; color:#6a4a2a; margin:4px 0 8px; }
.fld{ background:#fffdf6; border:2px solid #e8d6ad; border-radius:14px; padding:10px 14px; margin:8px 0; transition:border-color .2s, background .2s; }
.fld > label{ display:block; font-weight:600; margin-bottom:6px; font-size:16px; }
.fld.ok{ border-color:var(--ok); background:#effaee; }
.fld.bad{ border-color:var(--bad); background:#fff0ee; }
.inrow{ display:flex; align-items:center; gap:8px; }
.inrow input{ font-family:inherit; font-size:20px; width:170px; padding:8px 12px; border:2px solid #c9a46a; border-radius:10px; background:#fff; color:var(--ink); }
.inrow input:focus{ outline:3px solid #b99cff; }
.unit{ font-weight:600; color:#8a5a2b; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chips.col{ flex-direction:column; align-items:stretch; }
.chip{ font-family:inherit; font-size:16px; padding:8px 14px; border-radius:12px; border:2px solid #c9a46a; background:#fff; color:var(--ink); cursor:pointer; text-align:left; }
.chip.on{ background:#7b5ad6; border-color:#4b2f9a; color:#fff; }
.tfrow{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 0; border-bottom:1px dashed #e8d6ad; font-size:16px; }
.tfrow:last-child{ border-bottom:none; }
.tfb{ display:flex; gap:6px; flex:0 0 auto; }
.tfb .chip{ padding:6px 12px; }
.hint{ background:#fff6cf; border:2px solid #f0c94a; border-radius:12px; padding:10px 12px; margin:8px 0; font-size:16px; line-height:1.45; }
.msg{ min-height:1.2em; font-weight:600; margin-top:8px; font-size:16px; }
.msg.bad{ color:var(--bad); } .msg.warn{ color:#b0761a; }

/* Reward */
.reward{ text-align:center; }
.reward .shardbig svg{ width:110px; height:132px; animation:spin 1.6s ease-out; filter:drop-shadow(0 0 16px #9fe6ff); }
@keyframes spin{ 0%{ transform:scale(.2) rotate(-200deg); opacity:0 } 70%{ transform:scale(1.15) rotate(10deg); opacity:1 } 100%{ transform:scale(1) rotate(0) } }
.reward h2{ color:var(--violet); font-size:30px; margin:8px 0 2px; }
.plus{ font-size:26px; font-weight:700; color:#c07a10; }
.breakdown{ color:#8a5a2b; font-size:15px; margin-bottom:12px; }
.sol{ text-align:left; background:#fffdf6; border:2px solid #e8d6ad; border-radius:14px; padding:12px 14px; font-size:16px; line-height:1.5; }

/* Quest book */
.qrow{ display:flex; gap:12px; align-items:center; padding:10px 6px; border-bottom:2px dashed rgba(168,114,58,.3); }
.qi{ flex:0 0 46px; height:46px; border-radius:50%; display:grid; place-items:center; font-size:25px; border:2px solid var(--edge); background:#fff; }
.qt{ flex:1; min-width:0; font-size:16px; line-height:1.35; }
.qt small{ color:#7a5a3a; font-size:14px; }
.qrow.done .qt b{ color:var(--ok); }
.qb{ display:flex; gap:6px; flex:0 0 auto; }
.muted{ color:#8a6a4a; font-weight:400; }

/* Screens */
#screen{ position:fixed; inset:0; z-index:30; }
#screen:empty{ display:none; }
.center-wrap{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; }
.title-card{ text-align:center; max-width:640px; padding:30px 34px; }
.title-card .kick{ color:#8a5a2b; font-size:18px; font-weight:500; }
.title-card h1{ font-size:clamp(38px,6.4vw,64px); line-height:1.02; margin:10px 0 12px; color:#5a35b0;
  text-shadow:0 3px 0 #ffd77a, 0 6px 18px rgba(107,75,184,.35); }
.title-card .tag{ font-size:19px; line-height:1.45; margin:0 auto 20px; max-width:30em; }
.title-card .btns{ display:flex; flex-direction:column; gap:12px; align-items:center; }
.small{ font-size:15px; color:#7a5a3a; margin-top:16px; }
.setup{ position:absolute; inset:0; display:flex; align-items:center; padding:20px 24px; padding-top:calc(env(safe-area-inset-top,0px) + 20px); }
.setup .panel{ width:min(480px,100%); padding:22px 24px; max-height:100%; overflow:auto; }
@media (orientation:portrait){ .setup{ align-items:flex-start; justify-content:center; } }
.setup h2{ margin:0 0 12px; color:var(--violet); font-size:30px; }
.setup h3{ margin:18px 0 8px; font-size:18px; }
.namefield input{ font-family:inherit; font-size:21px; width:100%; padding:11px 14px; border:2px solid #c9a46a; border-radius:12px; background:#fff; margin-top:6px; color:var(--ink); }
.namefield{ font-weight:600; }
.picks{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.pick{ font-family:inherit; background:#fff; border:3px solid #e1caa0; border-radius:16px; padding:10px 6px; cursor:pointer; color:var(--ink); text-align:center; }
.pick .em{ font-size:38px; display:block; }
.pick b{ display:block; font-size:17px; margin-top:2px; }
.pick small{ display:block; font-size:12.5px; line-height:1.3; color:#7a5a3a; margin-top:4px; }
.pick.on{ border-color:#7b5ad6; background:#f1eaff; box-shadow:0 0 0 3px rgba(123,90,214,.25); }
.err{ color:var(--bad); font-weight:600; min-height:1.2em; margin:8px 0 0; }
.story-card{ max-width:640px; padding:26px 30px; font-size:20px; line-height:1.55; }
.story-card .pg{ color:#8a5a2b; font-size:15px; margin-bottom:6px; }
.story-card ul{ padding-left:0; list-style:none; margin:6px 0; }
.story-card li{ margin:7px 0; font-size:18px; }
.story-card .mbtns{ justify-content:space-between; }

/* Certificate */
.cert{ text-align:center; }
.cert .seal{ width:84px; height:84px; margin:0 auto; border-radius:50%; background:radial-gradient(#ffe7a0,#f0a93a); border:4px solid #b07a20; display:grid; place-items:center; font-size:44px; }
.cert h2.certname{ font-size:38px; color:var(--violet); margin:6px 0; }
.cert p{ font-size:18px; line-height:1.5; max-width:34em; margin:6px auto; }
.stars{ font-size:44px; color:#f0b21f; letter-spacing:6px; text-shadow:0 2px 0 #b07a20; }
.stars span{ color:#e2d3b2; text-shadow:none; }
.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0; }
.stats div{ background:#fffdf6; border:2px solid #e8d6ad; border-radius:12px; padding:8px 4px; }
.stats b{ display:block; font-size:21px; }
.stats small{ color:#7a5a3a; }
.cert table{ width:100%; border-collapse:collapse; font-size:15px; margin-top:8px; text-align:left; }
.cert td{ padding:5px 6px; border-bottom:1px dashed #e1caa0; }
.cert td:last-child{ text-align:right; font-weight:600; }
@media (max-width:560px){ .stats{ grid-template-columns:repeat(2,1fr); } .picks small{ display:none; } }
@media (prefers-reduced-motion: reduce){ .reward .shardbig svg{ animation:none; } #modalBox.shake{ animation:none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="hgroup">
    <div class="pill me"><span class="av" id="hAv">🐉</span><span id="hName">–</span></div>
  </div>
  <div class="hgroup" style="justify-content:center">
    <div class="pill">⏱ <span id="hTime">00:00</span></div>
    <div class="pill" id="hShards"></div>
    <div class="pill">⭐ <span id="hPts">0</span></div>
  </div>
  <div class="hgroup">
    <button class="btn sm" id="bQuest">📜 Questbuch</button>
    <button class="btn sm ghost" id="bHelp" aria-label="Hilfe und Einstellungen">❔</button>
  </div>
</div>
<canvas id="minimap" class="hidden" width="256" height="256"></canvas>
<div id="camCtl" class="hidden">
  <button data-c="l" aria-label="Kamera links drehen">⟲</button><button data-c="r" aria-label="Kamera rechts drehen">⟳</button>
  <button data-c="in" aria-label="Heranzoomen">＋</button><button data-c="out" aria-label="Herauszoomen">－</button>
</div>
<div id="dpad" class="hidden">
  <span></span><button data-k="f" aria-label="Vorwärts">▲</button><span></span>
  <button data-k="l" aria-label="Links">◀</button><button class="talk" id="dTalk" aria-label="Sprechen">💬</button><button data-k="r" aria-label="Rechts">▶</button>
  <span></span><button data-k="b" aria-label="Rückwärts">▼</button><span></span>
</div>
<div id="toast"></div>
<div id="dialog" class="parchment hidden">
  <div class="portrait" id="dPortrait"></div>
  <div class="dbody"><div class="dname" id="dName"></div><div class="dtext" id="dText"></div><div class="dopts" id="dOpts"></div></div>
</div>
<div id="modal" class="hidden"><div class="parchment" id="modalBox"></div></div>
<div id="screen"></div>
<canvas id="fx"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SAVE_KEY='proportanien_save_v1';

const CHARS={
  dragon:{em:'🐉',label:'Drache',art:'kleiner Drache',desc:'Klein, grün, großes Ego. Spuckt Funken, wenn er aufgeregt ist.'},
  unicorn:{em:'🦄',label:'Einhorn',art:'Einhorn',desc:'Regenbogenmähne, goldenes Horn. Glitzert ungefragt.'},
  griffin:{em:'🦅',label:'Greif',art:'Greif',desc:'Halb Adler, halb Löwe, ganz cool. Behält immer den Überblick.'}
};
const SHARD_SVG='<svg viewBox="0 0 40 48" class="shard" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#bfefff"/><stop offset="1" stop-color="#7fb2ff"/></linearGradient></defs><polygon points="20,2 36,16 30,46 6,38 3,14" fill="url(#sg)" stroke="#4a6fb5" stroke-width="2.5" stroke-linejoin="round"/><path d="M20 2 L18 24 L30 46 M18 24 L3 14" fill="none" stroke="#fff" stroke-width="1.6" opacity=".85"/></svg>';

/* ================= FIGURES (SVG) ================= */
function gridSVG(cols,rows,u,pad,inner){
  let s=`<svg viewBox="0 0 ${cols*u+2*pad} ${rows*u+2*pad}" class="fig" role="img"><g stroke="#d8c8a4" stroke-width="1">`;
  for(let i=0;i<=cols;i++) s+=`<line x1="${pad+i*u}" y1="${pad}" x2="${pad+i*u}" y2="${pad+rows*u}"/>`;
  for(let j=0;j<=rows;j++) s+=`<line x1="${pad}" y1="${pad+j*u}" x2="${pad+cols*u}" y2="${pad+j*u}"/>`;
  return s+'</g>'+inner+'</svg>';
}
function pts(arr,rows,u,pad){ return arr.map(([x,y])=>`${pad+x*u},${pad+(rows-y)*u}`).join(' '); }
const TXT='font-family="Fredoka,sans-serif" fill="#3b2a1a" text-anchor="middle" font-weight="600"';
const FIG={
  f1(){ return `<svg viewBox="0 0 410 150" class="fig" role="img"><g fill="#e6dccb" stroke="#4a3520" stroke-width="2">
<rect x="10" y="30" width="135" height="90"/><rect x="162" y="45" width="40" height="60"/>
<polygon points="215,78 272,78 297,42 240,42"/><rect x="232" y="100" width="50" height="25"/>
<rect x="310" y="72" width="30" height="45" transform="rotate(45 325 94.5)"/><rect x="372" y="20" width="22" height="88"/></g>
<g ${TXT} font-size="16"><text x="77" y="81">Original</text><text x="182" y="81">A</text><text x="256" y="66">B</text><text x="257" y="118">C</text><text x="325" y="100">D</text><text x="383" y="69">E</text></g></svg>`; },
  f2(){ const u=14,p=8,R=8; const tri=(a,l,lx,ly)=>`<polygon points="${pts(a,R,u,p)}" fill="#e6dccb" stroke="#3b2a1a" stroke-width="2"/><text x="${p+lx*u}" y="${p+(R-ly)*u+5}" ${TXT} font-size="14">${l}</text>`;
    return gridSVG(28,8,u,p, tri([[0,0],[9,0],[0,3]],'A',2.6,0.9)+tri([[10,7],[18,7],[14,5]],'B',14,6.25)+tri([[12,0],[16,0],[14,1]],'C',14,1.7)+tri([[20,0],[22,0],[21,7]],'D',21,1.6)+tri([[25,0],[27,0],[27,6]],'E',26.4,1.6)); },
  f4(){ const u=26,p=8,R=7; const P=[[0,0],[4,0],[4,2],[6,2],[4,4],[0,2]].map(([x,y])=>[x+2,y+1]);
    return gridSVG(10,7,u,p,`<polygon points="${pts(P,R,u,p)}" fill="#e6dccb" stroke="#3b2a1a" stroke-width="3" stroke-linejoin="round"/>`); },

function rr(x,X,Y,W,H,R){ x.beginPath(); x.moveTo(X+R,Y); x.lineTo(X+W-R,Y); x.quadraticCurveTo(X+W,Y,X+W,Y+R); x.lineTo(X+W,Y+H-R); x.quadraticCurveTo(X+W,Y+H,X+W-R,Y+H); x.lineTo(X+R,Y+H); x.quadraticCurveTo(X,Y+H,X,Y+H-R); x.lineTo(X,Y+R); x.quadraticCurveTo(X,Y,X+R,Y); x.closePath(); }
function labelTex(name,status){
  const c=document.createElement('canvas'); c.width=256; c.height=160; const x=c.getContext('2d');
  const col=status==='done'?'#3fae5a':status==='active'?'#4a8fe0':status==='goal'?'#7b5ad6':'#f2b631';
  const sym=status==='done'?'✓':status==='active'?'?':status==='goal'?'★':'!';
  x.fillStyle=col; x.strokeStyle='#ffffff'; x.lineWidth=7; x.beginPath(); x.arc(128,52,40,0,Math.PI*2); x.fill(); x.stroke();
  x.fillStyle='#fff'; x.font='700 52px Fredoka, sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(sym,128,56);
  x.font='600 30px Fredoka, sans-serif'; const tw=x.measureText(name).width+30;
  x.fillStyle='rgba(50,28,10,.78)'; rr(x,128-tw/2,104,tw,46,23); x.fill(); x.fillStyle='#fff'; x.fillText(name,128,128);
  const t=new THREE.CanvasTexture(c); return t;
}

/* ================= PATHFINDING ================= */
const G={x0:-45,z0:-45,w:91,h:81}; let blocked;
function buildGrid(){ blocked=new Uint8Array(G.w*G.h); for(let j=0;j<G.h;j++) for(let i=0;i<G.w;i++){ const x=G.x0+i, z=G.z0+j; let b=x<-44||x>44||z<-36||z>31.5; if(!b) b=inObstacle(x,z,0.65); blocked[j*G.w+i]=b?1:0; } }
const cellOf=(x,z)=>[Math.round(x-G.x0),Math.round(z-G.z0)];
const isFree=(i,j)=>i>=0&&j>=0&&i<G.w&&j<G.h&&!blocked[j*G.w+i];
function nearestFree(i,j){ if(isFree(i,j)) return [i,j]; for(let r=1;r<25;r++){ let best=null,bd=1e9; for(let dj=-r;dj<=r;dj++) for(let di=-r;di<=r;di++){ if(Math.max(Math.abs(di),Math.abs(dj))!==r) continue; if(isFree(i+di,j+dj)){ const d=di*di+dj*dj; if(d<bd){ bd=d; best=[i+di,j+dj]; } } } if(best) return best; } return null; }
function lineFree(ax,az,bx,bz){ const d=Math.hypot(bx-ax,bz-az); const n=Math.max(1,Math.ceil(d/0.3)); for(let k=0;k<=n;k++){ const c=cellOf(ax+(bx-ax)*k/n,az+(bz-az)*k/n); if(!isFree(c[0],c[1])) return false; } return true; }
function findPath(sx,sz,tx,tz){
  const s=nearestFree(...cellOf(sx,sz)), t=nearestFree(...cellOf(tx,tz)); if(!s||!t) return null;
  const W=G.w, N=W*G.h, gS=new Float32Array(N).fill(Infinity), came=new Int32Array(N).fill(-1), closed=new Uint8Array(N);
  const si=s[1]*W+s[0], ti=t[1]*W+t[0];
  const hh=k=>{ const dx=Math.abs(k%W-t[0]), dz=Math.abs(((k/W)|0)-t[1]); return Math.max(dx,dz)+0.414*Math.min(dx,dz); };
  const heap=[]; const push=(k,f)=>{ heap.push([f,k]); let i=heap.length-1; while(i>0){ const p=(i-1)>>1; if(heap[p][0]<=heap[i][0]) break; [heap[p],heap[i]]=[heap[i],heap[p]]; i=p; } };
  const pop=()=>{ const top=heap[0], last=heap.pop(); if(heap.length){ heap[0]=last; let i=0; for(;;){ const l=2*i+1,r=l+1; let m=i; if(l<heap.length&&heap[l][0]<heap[m][0]) m=l; if(r<heap.length&&heap[r][0]<heap[m][0]) m=r; if(m===i) break; [heap[m],heap[i]]=[heap[i],heap[m]]; i=m; } } return top[1]; };
  gS[si]=0; push(si,hh(si)); let found=si===ti;
  while(heap.length&&!found){ const cur=pop(); if(closed[cur]) continue; closed[cur]=1; if(cur===ti){ found=true; break; }
    const ci=cur%W, cj=(cur/W)|0;
    for(let dj=-1;dj<=1;dj++) for(let di=-1;di<=1;di++){ if(!di&&!dj) continue; const ni=ci+di,nj=cj+dj; if(!isFree(ni,nj)) continue; if(di&&dj&&(!isFree(ci+di,cj)||!isFree(ci,cj+dj))) continue;
      const nk=nj*W+ni, ng=gS[cur]+(di&&dj?1.414:1); if(ng<gS[nk]){ gS[nk]=ng; came[nk]=cur; push(nk,ng+hh(nk)); } } }
  if(!found) return null;
  const cells=[]; let k=ti; while(k!==-1&&k!==si){ cells.push({x:G.x0+k%W,z:G.z0+((k/W)|0)}); k=came[k]; } cells.reverse();
  const tc=cellOf(tx,tz); const end=(tc[0]===t[0]&&tc[1]===t[1])?{x:tx,z:tz}:{x:G.x0+t[0],z:G.z0+t[1]};
  if(cells.length) cells[cells.length-1]=end; else cells.push(end);
  const all=[{x:sx,z:sz},...cells]; const out=[]; let a=0;
  while(a<all.length-1){ let m=all.length-1; while(m>a+1&&!lineFree(all[a].x,all[a].z,all[m].x,all[m].z)) m--; out.push(all[m]); a=m; }
  return out;
}

/* ================= PLAYER ================= */
const player={obj:null,path:null,onArrive:null,speed:7.5};
function buildPlayer(ch){ if(player.obj) scene.remove(player.obj); player.obj=makeCreature(ch); player.obj.traverse(o=>{ if(o.isMesh) o.castShadow=true; }); scene.add(player.obj); player.obj.position.set(0,0,27); player.obj.rotation.y=Math.PI; player.path=null; player.onArrive=null; }
function lerpAngle(a,b,t){ let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI; return a+d*t; }
function walkTo(x,z,cb){ const p=player.obj.position; const path=findPath(p.x,p.z,x,z); if(!path){ toast('Da komme ich nicht hin.'); return false; } player.path=path; player.onArrive=cb; if(!path.length){ player.path=null; if(cb) cb(); } return true; }
function approachNPC(n){
  sfx('click'); const p=player.obj.position; const dx=p.x-n.pos[0], dz=p.z-n.pos[1]; const d=Math.hypot(dx,dz)||1;
  const arrive=()=>{ player.obj.rotation.y=Math.atan2(n.pos[0]-player.obj.position.x,n.pos[1]-player.obj.position.z); talkTo(n); };
  if(d<3.2){ player.path=null; arrive(); return; }
  walkTo(n.pos[0]+dx/d*2,n.pos[1]+dz/d*2,arrive);
}
function updatePlayer(dt,t){
  const o=player.obj; let moving=false;
  const ix=(keys.r?1:0)-(keys.l?1:0), iz=(keys.f?1:0)-(keys.b?1:0);
  if(ix||iz){
    const fx=-Math.sin(camAngle), fz=-Math.cos(camAngle), rx=Math.cos(camAngle), rz=-Math.sin(camAngle);
    let dx=fx*iz+rx*ix, dz=fz*iz+rz*ix; const l=Math.hypot(dx,dz); dx/=l; dz/=l;
    const step=player.speed*dt, px=o.position.x, pz=o.position.z, nx=px+dx*step, nz=pz+dz*step;
    const stuck=!walkable(px,pz);
    if(stuck||walkable(nx,nz)){ o.position.x=nx; o.position.z=nz; }
    else if(walkable(nx,pz)) o.position.x=nx;
    else if(walkable(px,nz)) o.position.z=nz;
    o.rotation.y=lerpAngle(o.rotation.y,Math.atan2(dx,dz),1-Math.pow(0.0002,dt));
    animateCreature(o,t,true);
    const n=nearestNPC(3.5); if(n&&n!==nearHint){ nearHint=n; toast(`${n.name}: Leertaste oder 💬 zum Sprechen`,2200); } else if(!n) nearHint=null;
    return;
  }
  if(player.path&&player.path.length){ const wp=player.path[0]; const dx=wp.x-o.position.x, dz=wp.z-o.position.z, d=Math.hypot(dx,dz), step=player.speed*dt;
    if(d>0.01) o.rotation.y=lerpAngle(o.rotation.y,Math.atan2(dx,dz),1-Math.pow(0.0002,dt));
    if(d<=step){ o.position.x=wp.x; o.position.z=wp.z; player.path.shift(); if(!player.path.length){ player.path=null; const cb=player.onArrive; player.onArrive=null; if(cb) cb(); } }
    else { o.position.x+=dx/d*step; o.position.z+=dz/d*step; moving=true; } }
  animateCreature(o,t,moving);
}

let camAngle=0, camDist=17; const camTarget=new THREE.Vector3(); const tmpV=new THREE.Vector3();
function updateCam(dt,snap){ const p=player.obj.position; const k=camDist/17; tmpV.set(p.x+Math.sin(camAngle)*camDist,13*k+1,p.z+Math.cos(camAngle)*camDist);
  if(snap){ camera.position.copy(tmpV); camTarget.set(p.x,1.2,p.z); } else { camera.position.lerp(tmpV,1-Math.pow(0.002,dt)); camTarget.lerp(new THREE.Vector3(p.x,1.2,p.z),1-Math.pow(0.0008,dt)); }
  camera.lookAt(camTarget); }
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
let ptr=null;
canvas.addEventListener('pointerdown',e=>{ if(ptr) return; ptr={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:false}; try{ canvas.setPointerCapture(e.pointerId); }catch(_){} });

const endPtr=e=>{ if(!ptr||e.pointerId!==ptr.id) return; const tap=!ptr.moved; ptr=null; if(tap) onTap(e.clientX,e.clientY); };
canvas.addEventListener('pointerup',endPtr); canvas.addEventListener('pointercancel',e=>{ if(ptr&&e.pointerId===ptr.id) ptr=null; });
function onTap(cx,cy){

  const r=canvas.getBoundingClientRect(); ndc.set((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height)*2+1); ray.setFromCamera(ndc,camera);

}

function parseNum(s){
  s=(s||'').toLowerCase().replace(/\s+/g,'').replace(/,/g,'.');

  s=s.replace(/(mm|cm|dm|km|m)(\^?[23²³])?/g,'').replace(/[^0-9.:\/\-]/g,'');
  let v; if(/[:\/]/.test(s)){ const [a,b]=s.split(/[:\/]/).map(parseFloat); v=a/b; } else v=parseFloat(s);
  if(pct) v/=100; return v;
}

function checkField(f,el){
  if(f.t==='num'){ const v=parseNum(el.querySelector('input').value); if(!isFinite(v)) return false; if(Math.abs(v-f.ans)<=f.tol) return true; if(f.recip&&v!==0&&Math.abs(1/v-f.ans)<=f.tol*Math.max(1,f.ans)) return true; return false; }
  if(f.t==='multi'){ const on=[...el.querySelectorAll('.chip.on')].map(b=>b.dataset.v); return on.length===f.correct.length&&f.correct.every(c=>on.includes(c)); }
  if(f.t==='single'){ const b=el.querySelector('.chip.on'); return !!b&&+b.dataset.v===f.correct; }
  if(f.t==='tf') return f.items.every(it=>{ const b=el.querySelector(`.tfrow[data-k="${it.k}"] .chip.on`); return !!b&&(b.dataset.v==='1')===f.correct[it.k]; });

}

  $('#screen').innerHTML=`<div class="center-wrap"><div class="title-card parchment">
    <div class="kick">Ein Mathe-Abenteuer zur Ähnlichkeit</div><h1>Die Scherben von Proportanien</h1>
    <p class="tag">Ein verzaubertes Dorf, ein zerbrochener Spiegel und elf Scherben. Wer sie findet, bricht den Bann – aber nur mit Mathe.</p>
    <div class="btns">${sv&&sv.name?`<button class="btn big" id="bCont">Weiterspielen als ${esc(sv.name)}</button><button class="btn ghost" id="bNew">Neues Spiel</button>`:`<button class="btn big" id="bNew">Spiel starten</button>`}</div>
    <p class="small">📓 Halte dein Heft und einen Stift bereit!</p></div></div>`;
  let armed=false;
  $('#bNew').onclick=e=>{ sfx('click'); if(sv&&sv.name&&!armed){ armed=true; e.target.textContent='Alten Spielstand löschen?'; return; } clearSave(); showSetup(); };
  if($('#bCont')) $('#bCont').onclick=()=>{ sfx('click'); S=sv; S.hints=S.hints||{}; S.wrong=S.wrong||{}; S.points=S.points||{}; S.tasks=S.tasks||{}; buildPlayer(S.char); startPlay(true); };
}
function showSetup(){
  mode='select'; setPreviewOffset(); selectChar(selChar);
  $('#screen').innerHTML=`<div class="setup"><div class="panel parchment">
    <h2>Wer bist du?</h2>
    <label class="namefield">Dein Name<input id="inName" maxlength="24" placeholder="Vor- und Nachname" autocomplete="off" autocorrect="off"></label>
    <h3>Wähle dein Fabelwesen</h3>
    <div class="picks">${Object.entries(CHARS).map(([k,c])=>`<button class="pick ${k===selChar?'on':''}" data-c="${k}"><span class="em">${c.em}</span><b>${c.label}</b><small>${c.desc}</small></button>`).join('')}</div>
    <p class="err" id="sErr"></p>
    <button class="btn big" id="bGo" style="width:100%;margin-top:4px">Abenteuer starten</button></div></div>`;
  $('#screen').querySelectorAll('.pick').forEach(b=>b.onclick=()=>{ sfx('pop'); selectChar(b.dataset.c); $('#screen').querySelectorAll('.pick').forEach(x=>x.classList.toggle('on',x===b)); });
  $('#bGo').onclick=()=>{ const name=$('#inName').value.trim(); if(name.length<2){ $('#sErr').textContent='Bitte gib deinen Namen ein (mindestens 2 Zeichen).'; $('#inName').focus(); return; }
    sfx('click'); $('#inName').blur(); S=newState(name,selChar); save(); buildPlayer(selChar); showStory(0); };
}
function selectChar(c){ selChar=c; Object.entries(previews).forEach(([k,p])=>p.visible=k===c); hopT=0; }
const STORY=[
  ()=>'Es war einmal ein Dorf namens <b>Proportanien</b>. Dort passte alles perfekt zusammen: die Türen zu den Häusern, die Hüte zu den Köpfen und die Pizzen zu den Preisen.',
  ()=>'Doch eines Tages schaute der eitle Zauberer <b>Verzerrus</b> in den Großen Zauberspiegel – und fand sich zu klein. Wutentbrannt zerschlug er ihn in <b>11 Scherben</b>.',
  ()=>`Seitdem liegt ein Bann über dem Dorf: Alles ist ein bisschen verzerrt, und niemand kommt mehr hinaus. Auch du nicht, ${esc(S.name)}. Du bist nämlich gerade als ${CHARS[S.char].art} durchs Südtor spaziert … und es hat sich hinter dir geschlossen. 😬`,
  ()=>'Die Dorfbewohner haben die Scherben gefunden. Sie geben sie dir aber nur, wenn du ihre Probleme löst – und die haben alle mit <b>Ähnlichkeit</b> zu tun. Bring alle Scherben zum <b>Spiegelturm im Norden</b>!',
  ()=>'<b>So spielst du:</b><ul><li>👆 Tippe auf den Boden, um zu laufen – oder nutze die Pfeiltasten bzw. das Steuerkreuz.</li><li>💬 Tippe auf Personen, um mit ihnen zu sprechen (Tastatur: Leertaste).</li><li>✏️ Rechne im Heft und gib das Ergebnis danach bei der Person ein.</li><li>💡 Tipps helfen, kosten aber Punkte.</li><li>📜 Im Questbuch stehen alle Aufträge.</li><li>⏱ Die Zeit läuft mit, aber ohne Limit. Lieber richtig als schnell!</li></ul>'
];
function showStory(i){
  mode='story';
  $('#screen').innerHTML=`<div class="center-wrap"><div class="story-card parchment"><div class="pg">${i+1} / ${STORY.length}</div><div>${STORY[i]()}</div>
    <div class="mbtns">${i<STORY.length-1?'<button class="btn ghost" id="sSkip">Überspringen</button>':'<span></span>'}<button class="btn big" id="sNext">${i<STORY.length-1?'Weiter':'Los geht\'s!'}</button></div></div></div>`;
  $('#sNext').onclick=()=>{ sfx('click'); if(i<STORY.length-1) showStory(i+1); else startPlay(false); };
  if($('#sSkip')) $('#sSkip').onclick=()=>{ sfx('click'); startPlay(false); };
}
function startPlay(resumed){
  mode='play'; $('#screen').innerHTML='';
  ['#hud','#minimap','#camCtl','#dpad'].forEach(s=>$(s).classList.remove('hidden'));
  refreshAllMarkers(); refreshMirror(); if(S.finished){ barrier.visible=false; mirrorGlow.material.opacity=0.35; }
  camAngle=0; updateCam(0,true); updateHUD();
  setTimeout(()=>toast(resumed?`Willkommen zurück, ${S.name}! ${countDone()} von 11 Scherben hast du schon.`:'Tipp: Auf dem Marktplatz warten schon die ersten Dorfbewohner!',4000),400);
}

/* ================= MAIN LOOP ================= */
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); setPreviewOffset();
  const dpr=Math.min(window.devicePixelRatio||1,2); fx.width=w*dpr; fx.height=h*dpr; }
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&S) save(); });
let T=0, last=performance.now(), hudAcc=0, saveAcc=0, mmAcc=0, gateWarn=0;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; T+=dt;
  if(mode==='select'){
    ped.rotation.y+=dt*0.5; hopT+=dt; const p=previews[selChar]; p.position.y=hopT<0.5?Math.sin(hopT/0.5*Math.PI)*0.4:0; animateCreature(p,T,false);
    renderer.render(pScene,pCam);
  } else {
    if(mode==='title'||mode==='story'){ const a=T*0.06; camera.position.set(Math.sin(a)*52,28,Math.cos(a)*52-4); camera.lookAt(0,2,-6); }
    if(player.obj&&(mode==='play'||mode==='ending')){ updatePlayer(dt,T); if(mode==='play') updateCam(dt,false); }
    if(mode==='ending') updateEnding(dt);
    npcObjs.forEach(n=>{ const o=n.obj; if(n.ghost) o.position.y=0.3+Math.sin(T*1.6)*0.25; else if(!n.owl) o.position.y=Math.abs(Math.sin(T*1.5+n.ph))*0.04;
      let want=n.baseRot; if(player.obj&&mode!=='title'){ const dx=player.obj.position.x-n.pos[0], dz=player.obj.position.z-n.pos[1]; if(dx*dx+dz*dz<64) want=Math.atan2(dx,dz); }
      o.rotation.y=lerpAngle(o.rotation.y,want,1-Math.pow(0.05,dt)); n.label.position.y=(n.owl?3.4:n.ghost?3.6:2.95)+Math.sin(T*2.4+n.ph)*0.08; });
    fountainStar.rotation.y+=dt*1.2; fountainStar.position.y=3+Math.sin(T*2)*0.15;
    if(barrier.visible) barrier.material.opacity=mode==='ending'?barrier.material.opacity:0.32+Math.sin(T*3)*0.12;
    boat.position.y=0.1+Math.sin(T*1.5)*0.06; boat.rotation.z=Math.sin(T*1.1)*0.05;
    bubbles.forEach(b=>{ b.position.y=0.85+((T*0.5+b.userData.ph)%1)*0.5; b.scale.setScalar(1-((T*0.5+b.userData.ph)%1)*0.6); });
    clouds.forEach(c=>{ c.position.x+=c.userData.v*dt; if(c.position.x>140) c.position.x=-140; });
    if(tapRing.material.opacity>0){ tapRing.material.opacity=Math.max(0,tapRing.material.opacity-dt*1.6); tapRing.scale.setScalar(1+(1-tapRing.material.opacity)*0.6); }
    if(mode!=='ending'&&S&&!S.finished) mirrorWedges.forEach((w,i)=>{ if(S.tasks[NPCS[i].id]==='done') w.material.color.setHSL(0.53,0.85,0.82+0.08*Math.sin(T*2+i)); });
    sky.position.copy(camera.position);
    renderer.render(scene,camera);
  }
  if(mode==='play'&&S){
    if(!S.finished&&!document.hidden) S.elapsed+=dt;
    hudAcc+=dt; if(hudAcc>0.5){ hudAcc=0; updateHUD(); }
    saveAcc+=dt; if(saveAcc>4){ saveAcc=0; save(); }
    mmAcc+=dt; if(mmAcc>0.1){ mmAcc=0; drawMinimap(); }
    if(!S.finished&&player.obj.position.z>29.5&&T-gateWarn>8){ gateWarn=T; toast('Das Tor ist verzaubert. Erst wenn der Spiegel heil ist, kommst du hier raus!'); }
  }
  drawConfetti(dt);
  requestAnimationFrame(loop);
}

/* ================= INIT ================= */
buildWorld(); spawnNPCs(); buildGrid(); resize(); showTitle();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ refreshAllMarkers(); signs.forEach(s=>s.userData.redraw()); });
requestAnimationFrame(loop);
</script>
</body>
</html>
